name: Font Coverage Check

# 카테고리 폰트가 한글 전체 음절을 실제로 지원하는지 점검하는 진단용 워크플로.
# 결과는 로그로만 남기고 아무것도 커밋하지 않는다.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node automation/font-coverage-check.mjs
